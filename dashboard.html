<html>
<head>
    <meta charset="UTF-8">
    <title>cLocked In Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f3f4f6; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 250px; background: white; padding: 20px; border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; }
        .logo { font-size: 1.5rem; font-weight: bold; margin-bottom: 40px; color: #111; }
        .stat-card { background: #f9fafb; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .stat-val { font-size: 1.5rem; font-weight: bold; color: #3b82f6; }
        .stat-label { font-size: 0.9rem; color: #6b7280; }

        /* Main Calendar Area */
        .main { flex: 1; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; overflow-y: auto; }
        
        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-shrink: 0; }
        .cal-title { font-size: 2rem; font-weight: bold; }
        .cal-nav button { padding: 8px 16px; font-size: 1rem; cursor: pointer; background: white; border: 1px solid #ddd; border-radius: 6px; }

        /* Grid */
        .calendar { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            grid-template-rows: auto repeat(6, 1fr); /* Header + 6 rows */
            gap: 8px; 
            background: #e5e7eb; 
            border: 1px solid #e5e7eb;
            flex: 0 0 calc(100vh - 95px);
            min-height: 560px;
            overflow: hidden;
        }
        
        .day-header { background: #f9fafb; padding: 10px; text-align: center; font-weight: bold; color: #666; }
        
        .day-cell { 
            background: white; 
            padding: 8px; 
            position: relative; 
            overflow-y: auto;
        }
        .day-cell.empty { background: #f9fafb; }
        .day-number { font-weight: bold; color: #374151; margin-bottom: 5px; }
        .day-today { background: #eff6ff; }
        
        /* Task Chips */
        .task-chip {
            background: #dbeafe;
            color: #1e40af;
            font-size: 0.8rem;
            padding: 4px 6px;
            border-radius: 4px;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-left: 3px solid #2563eb;
        }
        .task-chip:hover { transform: translateY(-1px); box-shadow: 0 1px 2px rgba(0,0,0,0.1); }

        /* Day View */
        .day-view {
            display: none;
            flex-direction: column;
            flex: 0 0 calc(100vh - 40px);
            min-height: 560px;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #e5e7eb;
        }
        .day-header-row {
            padding: 15px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            gap: 20px;
            background: #f9fafb;
        }
        .day-header-row h2 { margin: 0; font-size: 1.5rem; }
        .btn-back {
            padding: 8px 16px;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: #374151;
        }
        .btn-back:hover { background: #f3f4f6; }

        .day-scroll-area {
            flex: 1;
            overflow-y: auto;
            position: relative;
            padding: 20px;
        }
        .timeline-container {
            position: relative;
            height: 2880px; /* 24 hours * 120px */
            margin-left: 60px; /* Space for time labels */
            border-left: 1px solid #e5e7eb;
        }
        .time-label {
            position: absolute;
            left: -60px;
            width: 50px;
            text-align: right;
            font-size: 0.8rem;
            color: #9ca3af;
            transform: translateY(-50%);
        }
        .time-line {
            position: absolute;
            left: 0;
            right: 0;
            border-top: 1px solid #f3f4f6;
        }
        .task-block {
            position: absolute;
            left: 10px;
            right: 10px;
            background: rgba(59, 130, 246, 0.1);
            border-left: 4px solid #3b82f6;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            color: #1e40af;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s;
        }
        .task-block:hover {
            background: rgba(59, 130, 246, 0.2);
            z-index: 10;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .task-time { font-size: 0.75rem; opacity: 0.8; margin-bottom: 2px; }
        .task-name { font-weight: bold; }

        /* Weekly Goal Tracker */
        .goal-tracker {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            margin-top: 24px;
            margin-bottom: 20px;
            padding: 20px;
            flex-shrink: 0;
        }
        .goal-tracker-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 18px;
        }
        .goal-tracker-title { font-size: 1.5rem; font-weight: bold; color: #111827; }
        .goal-tracker-subtitle { color: #6b7280; font-size: 0.9rem; margin-top: 4px; }
        .goal-week-nav { display: flex; align-items: center; gap: 8px; }
        .goal-week-nav button, .goal-scroll-btn {
            padding: 8px 12px;
            cursor: pointer;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            color: #374151;
            font-weight: 600;
        }
        .goal-week-nav button:hover, .goal-scroll-btn:hover { background: #f9fafb; }
        .goal-week-label { min-width: 190px; text-align: center; font-weight: 600; color: #374151; }
        .goal-timeline-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .goal-timeline-toggle {
            display: inline-flex;
            padding: 4px;
            gap: 4px;
            border-radius: 8px;
            background: #f3f4f6;
        }
        .goal-timeline-toggle button {
            padding: 8px 14px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: #6b7280;
            cursor: pointer;
            font-weight: 700;
        }
        .goal-timeline-toggle button.good-active { background: #dcfce7; color: #166534; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
        .goal-timeline-toggle button.bad-active { background: #fee2e2; color: #991b1b; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
        .goal-timeline-hint { color: #6b7280; font-size: 0.82rem; }
        .goal-create-form {
            display: grid;
            grid-template-columns: minmax(220px, 1fr) 170px auto;
            gap: 10px;
            align-items: end;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 18px;
        }
        .goal-create-form[hidden] { display: none; }
        .goal-create-form.is-countable { grid-template-columns: minmax(220px, 1fr) 170px 150px auto; }
        .goal-field { display: flex; flex-direction: column; gap: 5px; }
        .goal-field[hidden] { display: none; }
        .goal-field label { color: #6b7280; font-size: 0.78rem; font-weight: 600; }
        .goal-field input, .goal-field select {
            box-sizing: border-box;
            width: 100%;
            height: 38px;
            padding: 8px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: white;
            font: inherit;
        }
        .goal-add-btn {
            height: 38px;
            padding: 0 18px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        .goal-add-btn:hover { background: #1d4ed8; }
        .goal-table-wrap { overflow-x: auto; border: 1px solid #e5e7eb; border-radius: 8px; }
        .goal-table { width: 100%; min-width: 900px; border-collapse: collapse; table-layout: fixed; }
        .goal-table th, .goal-table td { border-right: 1px solid #e5e7eb; border-bottom: 1px solid #e5e7eb; padding: 10px 8px; text-align: center; }
        .goal-table th:last-child, .goal-table td:last-child { border-right: 0; }
        .goal-table tbody tr:last-child td { border-bottom: 0; }
        .goal-table th { background: #f9fafb; color: #4b5563; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; }
        .goal-table th:first-child, .goal-table td:first-child { width: 180px; text-align: left; }
        .goal-table th.goal-progress-col { width: 90px; }
        .goal-table th.goal-actions-col { width: 55px; }
        .goal-day-date { display: block; margin-top: 3px; color: #9ca3af; font-size: 0.72rem; font-weight: normal; text-transform: none; }
        .goal-today { background: #eff6ff !important; }
        .goal-cell-hidden { color: #d1d5db; }
        .goal-name { font-weight: 600; color: #111827; overflow-wrap: anywhere; }
        .goal-type { display: inline-block; margin-top: 4px; padding: 2px 6px; border-radius: 999px; background: #f3f4f6; color: #6b7280; font-size: 0.7rem; }
        .goal-checkbox { width: 22px; height: 22px; cursor: pointer; accent-color: #2563eb; }
        .goal-count-input { width: 58px; padding: 6px; border: 1px solid #d1d5db; border-radius: 5px; text-align: center; font: inherit; }
        .goal-count-input:focus { outline: 2px solid #bfdbfe; border-color: #2563eb; }
        .goal-progress { font-weight: bold; color: #2563eb; font-size: 0.85rem; }
        .goal-progress-detail { color: #9ca3af; font-size: 0.68rem; margin-top: 2px; }
        .goal-delete { border: 0; background: transparent; color: #ef4444; cursor: pointer; font-size: 1rem; padding: 6px; border-radius: 4px; }
        .goal-delete:hover { background: #fef2f2; }
        .goal-empty { padding: 28px !important; color: #9ca3af; text-align: center !important; }

        @media (max-width: 1050px) {
            .goal-tracker-header { flex-direction: column; }
            .goal-timeline-bar { align-items: flex-start; flex-direction: column; }
            .goal-create-form { grid-template-columns: 1fr 1fr; }
            .goal-create-form.is-countable { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">cLocked In</div>
        <div class="stat-card">
            <div class="stat-val" id="total-tasks">0</div>
            <div class="stat-label" id="label-total-tasks">Tasks Completed Total</div>
        </div>
        <div class="stat-card">
            <div class="stat-val" id="total-hours">0h</div>
            <div class="stat-label" id="label-total-hours">Productive Time</div>
        </div>
        <div class="stat-card" id="sidebar-chart-card" style="display:none; text-align:center;">
            <canvas id="dayPieChart" width="200" height="200" style="width:100%; height:auto;"></canvas>
            <div class="stat-label" style="margin-top:10px;">Day Breakdown</div>
        </div>
        <div class="stat-card" id="sidebar-task-list" style="display:none;">
            <div class="stat-label" style="margin-bottom:10px; border-bottom: 1px solid #eee; padding-bottom: 5px;">Top Tasks</div>
            <div id="day-tasks-container"></div>
        </div>
    </div>

    <div class="main">
        <div class="cal-header" id="cal-header-main">
            <div class="cal-title" id="cal-month-year">November 2025</div>
            <div class="cal-nav">
                <button id="goals-btn" class="goal-scroll-btn">Weekly Goals</button>
                <button id="prev-month">&larr; Prev</button>
                <button id="today-btn">Today</button>
                <button id="next-month">Next &rarr;</button>
            </div>
        </div>

        <div class="calendar" id="calendar-grid">
        </div>

        <!-- Day View Container -->
        <div class="day-view" id="day-view">
            <div class="day-header-row">
                <button class="btn-back" id="btn-back-cal">&larr; Back</button>
                <h2 id="day-view-date">Date</h2>
            </div>
            <div class="day-scroll-area">
                <div class="timeline-container" id="day-timeline">
                    <!-- Generated via JS -->
                </div>
            </div>
        </div>

        <section class="goal-tracker" id="goal-tracker" aria-labelledby="goal-tracker-heading">
            <div class="goal-tracker-header">
                <div>
                    <div class="goal-tracker-title" id="goal-tracker-heading">Weekly Goal Tracker</div>
                    <div class="goal-tracker-subtitle">Completed entries leave Good Timeline and can be restored from Bad Timeline.</div>
                </div>
                <div class="goal-week-nav" aria-label="Goal tracker week navigation">
                    <button id="goal-prev-week" aria-label="Previous week">&larr;</button>
                    <button id="goal-current-week">This week</button>
                    <div class="goal-week-label" id="goal-week-label"></div>
                    <button id="goal-next-week" aria-label="Next week">&rarr;</button>
                </div>
            </div>

            <div class="goal-timeline-bar">
                <div class="goal-timeline-toggle" role="group" aria-label="Goal timeline view">
                    <button id="goal-good-timeline" type="button" aria-pressed="true">Good Timeline</button>
                    <button id="goal-bad-timeline" type="button" aria-pressed="false">Bad Timeline</button>
                </div>
                <div class="goal-timeline-hint" id="goal-timeline-hint"></div>
            </div>

            <form class="goal-create-form" id="goal-create-form">
                <div class="goal-field">
                    <label for="goal-name-input">Goal or task</label>
                    <input id="goal-name-input" type="text" maxlength="80" placeholder="e.g. Read for 20 minutes" required>
                </div>
                <div class="goal-field">
                    <label for="goal-type-input">Tracking type</label>
                    <select id="goal-type-input">
                        <option value="checkoff" selected>Daily checkoff</option>
                        <option value="countable">Daily count</option>
                    </select>
                </div>
                <div class="goal-field" id="goal-target-field" hidden>
                    <label for="goal-target-input">Daily target</label>
                    <input id="goal-target-input" type="number" min="1" step="1" value="1">
                </div>
                <button class="goal-add-btn" type="submit">Add goal</button>
            </form>

            <div class="goal-table-wrap">
                <table class="goal-table">
                    <thead id="goal-table-head"></thead>
                    <tbody id="goal-table-body"></tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="goal-tracker-logic.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
